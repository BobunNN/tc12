[project]
authors = [
  {name = "Nhan Nguyen"},
]
dependencies = [
  "fastapi[standard]>=0.133.0",
  "pwdlib[argon2]>=0.3.0",
  "pyjwt>=2.11.0",
  "sqlmodel>=0.0.37",
]
description = "Base fastapi application with user ressources and authentification"
name = "fastapi-users-api-starter"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[dependency-groups]
dev = [
  "alembic>=1.18.4",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.2",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["E501"]
